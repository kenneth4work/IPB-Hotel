<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" width="280" height="64">
  <!-- Crest Emblem -->
  <g transform="translate(4, 4)">
    <!-- Outer Octagon/Rounded Shield -->
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#1E3A2B" stroke="#C5A880" stroke-width="1.5" />
    <circle cx="28" cy="28" r="23" stroke="#C5A880" stroke-width="0.8" stroke-dasharray="2 2" />
    
    <!-- Monogram & Laurel -->
    <path d="M19 19 L19 37 M19 19 L26 19 C29.5 19 31.5 21 31.5 24 C31.5 27 29.5 29 26 29 L19 29" stroke="#C5A880" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M33 24 C35 21 37.5 19 40 19 L40 37" stroke="#EFE4D2" stroke-width="1.8" stroke-linecap="round" />
    
    <!-- Small Decorative Gold Star -->
    <polygon points="28,34 29,37 32,37 30,39 31,42 28,40 25,42 26,39 24,37 27,37" fill="#C5A880" />
  </g>

  <!-- Typography: Hotel Name -->
  <text x="74" y="30" font-family="Playfair Display, Georgia, serif" font-size="20" font-weight="700" fill="#0F172A" letter-spacing="-0.2">
    IPB Convention Hotel
  </text>

  <!-- Subtitle Tagline -->
  <text x="75" y="48" font-family="Plus Jakarta Sans, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#A8865B" letter-spacing="1.8">
    CONVENTION &amp; HOTEL · BOGOR
  </text>
</svg>
